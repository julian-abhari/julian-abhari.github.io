\",\"endDate\":\"2021-09\",\"location\":\"Tulsa, OK\",\"tags\":[\"csharp\",\"sql\",\"blazor\",\"full-stack\"],\"summary\":\"Built full-stack inventory management web app components using C#, Blazor, and SQL.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"work\",\"role\":\"Software Engineer Intern\",\"employmentType\":\"internship\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eContributed to the development of a web application for inventory management.\u003c/li\u003e\\n\u003cli\u003eUtilized SQL to query and manage data within a client\u0026#39;s database.\u003c/li\u003e\\n\u003cli\u003eDeveloped front-end and back-end components using C# and the Blazor framework.\u003c/li\u003e\\n\u003cli\u003eBuilt secure and efficient database interactions to support real-time inventory tracking.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"l3harris-software-engineer-intern\",\"title\":\"Software Engineer Intern\",\"organization\":\"L3Harris Technologies\",\"startDate\":\"2022-05\",\"endDate\":\"2022-09\",\"location\":\"Tulsa, OK\",\"tags\":[\"cpp\",\"computer-vision\",\"networking\",\"agile\"],\"summary\":\"Built a C++ library supporting GigE Vision camera technology as part of a collaborative engineering team.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"work\",\"role\":\"Software Engineer Intern\",\"employmentType\":\"internship\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eDeveloped a C++ library to support GigE Vision technology as part of a collaborative engineering team.\u003c/li\u003e\\n\u003cli\u003eDesigned and implemented UML diagrams to model software architecture and system behavior.\u003c/li\u003e\\n\u003cli\u003eEstablished and managed network connections across multiple devices for high-speed image transmission.\u003c/li\u003e\\n\u003cli\u003eServed as SCRUM Master, facilitating agile sprints and promoting team collaboration and efficiency.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"libr-biomedical-intern\",\"title\":\"Biomedical Intern\",\"organization\":\"Laureate Institute for Brain Research\",\"startDate\":\"2019-05\",\"endDate\":\"2019-08\",\"location\":\"Tulsa, OK\",\"tags\":[\"neuroscience\",\"clinical-research\"],\"summary\":\"Supported MRI-based neuroscience studies, including equipment setup and data collection from adult and pediatric participants.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"work\",\"role\":\"Biomedical Intern\",\"employmentType\":\"internship\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eInterned at the Laureate Institute for Brain Research (LIBR), supporting MRI-based neuroscience studies.\u003c/li\u003e\\n\u003cli\u003eEnsured proper setup and operation of MRI equipment prior to and during scan sessions.\u003c/li\u003e\\n\u003cli\u003eCollected and recorded research data from both adult and pediatric participants during brain imaging procedures.\u003c/li\u003e\\n\u003cli\u003eAssisted research staff in maintaining compliance with study protocols and participant safety standards.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"skincheck-founder-cto\",\"title\":\"Founder \u0026 Chief Technology Officer\",\"organization\":\"SkinCheck\",\"startDate\":\"2023-04\",\"endDate\":null,\"location\":\"Tulsa, OK / Remote\",\"tags\":[\"leadership\",\"computer-vision\",\"ios\",\"machine-learning\",\"dermatology\",\"startups\"],\"summary\":\"Founded and lead SkinCheck, an AI-driven early skin cancer detection platform that has served 175,000+ patients globally.\",\"featured\":false,\"links\":[{\"label\":\"Company site\",\"url\":\"https://skincheck.health\"}],\"media\":[],\"category\":\"work\",\"role\":\"Founder \u0026 Chief Technology Officer\",\"employmentType\":\"full-time\",\"html\":\"\u003cp\u003eFounder and CTO of SkinCheck, leading the development of AI-driven solutions for early skin cancer detection.\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003eSpearheaded the creation of a mobile app that has provided timely dermatological care to over 170,000 patients globally.\u003c/li\u003e\\n\u003cli\u003eConducted pioneering research in computer vision, resulting in peer-reviewed publications in top-tier computer science venues.\u003c/li\u003e\\n\u003cli\u003eInvented the first visual AI skin cancer detector designed for accuracy across all skin tones; patent-pending.\u003c/li\u003e\\n\u003cli\u003eDrives product innovation at the intersection of healthcare and technology to democratize access to expert dermatological assessment.\u003c/li\u003e\\n\u003cli\u003eOversees end-to-end software development, AI model deployment, and technical strategy for a global digital health platform.\u003c/li\u003e\\n\u003cli\u003eLeads engineering and development for the SkinCheck tele-dermatology platform, SC Connect.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"}],\"research\":[{\"id\":\"nsf-reu-racial-bias-skin-cancer\",\"title\":\"Mitigating Racial Biases for Skin Cancer Detection (NSF REU)\",\"organization\":\"Georgia State University, Department of Computer Science\",\"startDate\":\"2023-05\",\"endDate\":\"2023-08\",\"location\":\"Atlanta, GA\",\"tags\":[\"computer-vision\",\"cyclegan\",\"cnn\",\"bias-mitigation\",\"dermatology\"],\"summary\":\"NSF REU research on domain adaptation and CycleGAN-based dataset debiasing for more equitable skin cancer detection models.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"research\",\"institution\":\"Georgia State University\",\"lab\":\"NSF Research Experience for Undergraduates (REU) Program\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eConducted research on domain adaptation to improve model generalization across diverse image datasets.\u003c/li\u003e\\n\u003cli\u003eImplemented CycleGAN to translate images between domains and reduce dataset bias.\u003c/li\u003e\\n\u003cli\u003eAdapted and aligned multiple datasets to support equitable model performance across varying skin tones.\u003c/li\u003e\\n\u003cli\u003eTrained convolutional neural networks (CNNs) for image classification tasks.\u003c/li\u003e\\n\u003cli\u003eIntegrated the end-to-end AI pipeline into a mobile application for real-world deployment.\u003c/li\u003e\\n\u003cli\u003eAuthored and published a peer-reviewed paper detailing research findings and technical innovations (see \u003ca href=\\\"#\\\" data-entry-id=\\\"mitigating-racial-biases-mobihoc23\\\"\u003eMitigating Racial Biases for Machine Learning Based Skin Cancer Detection\u003c/a\u003e).\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"skincheck-inclusive-ai-demo\",\"title\":\"SkinCheck Inclusive AI: Mobile Application Demonstration\",\"organization\":\"SkinCheck Inc., Department of AI Research and Development\",\"startDate\":\"2024-05\",\"endDate\":\"2024-10\",\"location\":\"Remote\",\"tags\":[\"computer-vision\",\"ios\",\"android\",\"cloud\",\"machine-learning\",\"dermatology\"],\"summary\":\"Built and deployed a patent-pending on-device ML pipeline for skin cancer detection across iOS, Android, and the cloud.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"research\",\"institution\":\"SkinCheck Inc.\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eImplemented a novel, patent-pending machine learning pipeline optimized for native execution on iOS and Android GPUs.\u003c/li\u003e\\n\u003cli\u003eDeployed the same ML pipeline on Google Cloud\u0026#39;s Vertex AI platform for scalable cloud inference.\u003c/li\u003e\\n\u003cli\u003eEngineered cross-platform compatibility for real-time AI diagnostics across mobile and cloud environments.\u003c/li\u003e\\n\u003cli\u003ePresented the system demonstration at the Association for Health and Learning Inference (AHLI) ML4H Conference, December 2024, Vancouver, Canada.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"tu-bci-research\",\"title\":\"Brain-Computer Interface Machine Learning Inference Research\",\"organization\":\"The University of Tulsa, Tandy School of Computer Science\",\"startDate\":\"2020-09\",\"endDate\":\"2022-05\",\"location\":\"Tulsa, OK\",\"tags\":[\"machine-learning\",\"tensorflow\",\"pytorch\",\"neuroscience\",\"cnn\"],\"summary\":\"Developed ML models (CNNs, Random Forests, KNN) to predict hand movement from motor cortex signals as part of a university BCI research group, continuing through 2022.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"research\",\"institution\":\"The University of Tulsa\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eWorked as a Machine Learning Engineer and Researcher in a university Brain-Computer Interface (BCI) research group.\u003c/li\u003e\\n\u003cli\u003eDeveloped ML models using TensorFlow and PyTorch to predict hand movements from motor cortex signals.\u003c/li\u003e\\n\u003cli\u003eImplemented and evaluated Convolutional Neural Networks (CNNs), Random Forests, and K-Nearest Neighbors (KNN) algorithms.\u003c/li\u003e\\n\u003cli\u003eDesigned and tested an ensemble learning approach to improve prediction accuracy across models.\u003c/li\u003e\\n\u003cli\u003eContributed to a co-authored paper on model-selection voting for EEG data assessment (see \u003ca href=\\\"#\\\" data-entry-id=\\\"ml-democracy-icmla22\\\"\u003eML Democracy: An Enhanced Voting Algorithm for Model Selection for Efficient EEG Data Assessment\u003c/a\u003e).\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"tu-skin-cancer-detection-research\",\"title\":\"Skin Cancer Detection: Machine Learning Mobile Application\",\"organization\":\"The University of Tulsa, Tandy School of Computer Science\",\"startDate\":\"2021-05\",\"endDate\":\"2022-04\",\"location\":\"Tulsa, OK\",\"tags\":[\"computer-vision\",\"ios\",\"machine-learning\",\"dermatology\"],\"summary\":\"Developed an iOS application and ML model to detect and track potentially cancerous moles from patient-provided images.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"research\",\"institution\":\"The University of Tulsa\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eConducted research in computer vision with a focus on medical image analysis for skin cancer detection.\u003c/li\u003e\\n\u003cli\u003eDeveloped a machine learning model to identify potentially cancerous moles from patient-provided images.\u003c/li\u003e\\n\u003cli\u003eBuilt and deployed an iOS application enabling users to scan and assess moles for signs of skin cancer.\u003c/li\u003e\\n\u003cli\u003eIntegrated AI diagnostics into a user-friendly mobile interface to support early intervention and self-screening.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"}],\"projects\":[{\"id\":\"a-short-adventure-java-game\",\"title\":\"A Short Adventure: Java Game\",\"organization\":null,\"startDate\":\"2020-01\",\"endDate\":null,\"tags\":[\"java\",\"game-engine\",\"teavm\",\"webassembly\",\"physics\"],\"summary\":\"Story-driven game built on a custom Java engine, later expanded with tuned 2D physics and ported to WebAssembly to power this portfolio's interactive world.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"java\",\"teavm\",\"webassembly\",\"physics\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eExpanded upon the \u003ca href=\\\"#\\\" data-entry-id=\\\"electroblast-java-game\\\"\u003eElectroblast: Java Game\u003c/a\u003e engine to add in more story-driven elements, such as NPCs that you can talk to and adaptive music. Development continued over the years, most recently adding tuned 2D physics and mobile tap support. The engine was later ported — rendering, input, and resource loading — to WebAssembly via TeaVM, becoming the engine that powers this portfolio site itself.\u003c/p\u003e\\n\u003cp\u003ePublicly titled \u0026quot;A Short Adventure\u0026quot; rather than its working/internal name to keep a family member\u0026#39;s name private.\u003c/p\u003e\\n\"},{\"id\":\"airlectric-drifter-multiplayer-java-game\",\"title\":\"Airlectric Drifter: Multiplayer Java Game\",\"organization\":null,\"startDate\":\"2021-01\",\"endDate\":\"2021-12\",\"tags\":[\"java\",\"game-engine\",\"networking\"],
