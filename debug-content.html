\"h1\",null,{\"className\":\"text-2xl font-bold\",\"children\":\"Content Debug\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-sm opacity-70\",\"children\":[\"Every entry from every category, generated at build time from\",\" \",[\"$\",\"code\",null,{\"children\":\"content/**/*.md\"}],\". Click one to preview its ContentPanel.\"]}],[\"$\",\"$L4\",null,{\"entriesByCategory\":{\"work\":[{\"id\":\"frontier-software-engineer-intern\",\"title\":\"Software Engineer Intern\",\"organization\":\"Frontier\",\"startDate\":\"2021-05\",\"endDate\":\"2021-09\",\"location\":\"Tulsa, OK\",\"tags\":[\"csharp\",\"sql\",\"blazor\",\"full-stack\"],\"summary\":\"Built full-stack inventory management web app components using C#, Blazor, and SQL.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"work\",\"role\":\"Software Engineer Intern\",\"employmentType\":\"internship\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eContributed to the development of a web application for inventory management.\u003c/li\u003e\\n\u003cli\u003eUtilized SQL to query and manage data within a client\u0026#39;s database.\u003c/li\u003e\\n\u003cli\u003eDeveloped front-end and back-end components using C# and the Blazor framework.\u003c/li\u003e\\n\u003cli\u003eBuilt secure and efficient database interactions to support real-time inventory tracking.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"l3harris-software-engineer-intern\",\"title\":\"Software Engineer Intern\",\"organization\":\"L3Harris Technologies\",\"startDate\":\"2022-05\",\"endDate\":\"2022-09\",\"location\":\"Tulsa, OK\",\"tags\":[\"cpp\",\"computer-vision\",\"networking\",\"agile\"],\"summary\":\"Built a C++ library supporting GigE Vision camera technology as part of a collaborative engineering team.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"work\",\"role\":\"Software Engineer Intern\",\"employmentType\":\"internship\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eDeveloped a C++ library to support GigE Vision technology as part of a collaborative engineering team.\u003c/li\u003e\\n\u003cli\u003eDesigned and implemented UML diagrams to model software architecture and system behavior.\u003c/li\u003e\\n\u003cli\u003eEstablished and managed network connections across multiple devices for high-speed image transmission.\u003c/li\u003e\\n\u003cli\u003eServed as SCRUM Master, facilitating agile sprints and promoting team collaboration and efficiency.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"libr-biomedical-intern\",\"title\":\"Biomedical Intern\",\"organization\":\"Laureate Institute for Brain Research\",\"startDate\":\"2019-05\",\"endDate\":\"2019-08\",\"location\":\"Tulsa, OK\",\"tags\":[\"neuroscience\",\"clinical-research\"],\"summary\":\"Supported MRI-based neuroscience studies, including equipment setup and data collection from adult and pediatric participants.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"work\",\"role\":\"Biomedical Intern\",\"employmentType\":\"internship\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eInterned at the Laureate Institute for Brain Research (LIBR), supporting MRI-based neuroscience studies.\u003c/li\u003e\\n\u003cli\u003eEnsured proper setup and operation of MRI equipment prior to and during scan sessions.\u003c/li\u003e\\n\u003cli\u003eCollected and recorded research data from both adult and pediatric participants during brain imaging procedures.\u003c/li\u003e\\n\u003cli\u003eAssisted research staff in maintaining compliance with study protocols and participant safety standards.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"skincheck-founder-cto\",\"title\":\"Founder \u0026 Chief Technology Officer\",\"organization\":\"SkinCheck\",\"startDate\":\"2023-04\",\"endDate\":null,\"location\":\"Tulsa, OK / Remote\",\"tags\":[\"leadership\",\"computer-vision\",\"ios\",\"machine-learning\",\"dermatology\",\"startups\"],\"summary\":\"Founded and lead SkinCheck, an AI-driven early skin cancer detection platform that has served 175,000+ patients globally.\",\"featured\":false,\"links\":[{\"label\":\"Company site\",\"url\":\"https://skincheck.health\"}],\"media\":[],\"category\":\"work\",\"role\":\"Founder \u0026 Chief Technology Officer\",\"employmentType\":\"full-time\",\"html\":\"\u003cp\u003eFounder and CTO of SkinCheck, leading the development of AI-driven solutions for early skin cancer detection.\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003eSpearheaded the creation of a mobile app that has provided timely dermatological care to over 170,000 patients globally.\u003c/li\u003e\\n\u003cli\u003eConducted pioneering research in computer vision, resulting in peer-reviewed publications in top-tier computer science venues.\u003c/li\u003e\\n\u003cli\u003eInvented the first visual AI skin cancer detector designed for accuracy across all skin tones; patent-pending.\u003c/li\u003e\\n\u003cli\u003eDrives product innovation at the intersection of healthcare and technology to democratize access to expert dermatological assessment.\u003c/li\u003e\\n\u003cli\u003eOversees end-to-end software development, AI model deployment, and technical strategy for a global digital health platform.\u003c/li\u003e\\n\u003cli\u003eLeads engineering and development for the SkinCheck tele-dermatology platform, SC Connect.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"}],\"research\":[{\"id\":\"nsf-reu-racial-bias-skin-cancer\",\"title\":\"Mitigating Racial Biases for Skin Cancer Detection (NSF REU)\",\"organization\":\"Georgia State University, Department of Computer Science\",\"startDate\":\"2023-05\",\"endDate\":\"2023-08\",\"location\":\"Atlanta, GA\",\"tags\":[\"computer-vision\",\"cyclegan\",\"cnn\",\"bias-mitigation\",\"dermatology\"],\"summary\":\"NSF REU research on domain adaptation and CycleGAN-based dataset debiasing for more equitable skin cancer detection models.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"research\",\"institution\":\"Georgia State University\",\"lab\":\"NSF Research Experience for Undergraduates (REU) Program\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eConducted research on domain adaptation to improve model generalization across diverse image datasets.\u003c/li\u003e\\n\u003cli\u003eImplemented CycleGAN to translate images between domains and reduce dataset bias.\u003c/li\u003e\\n\u003cli\u003eAdapted and aligned multiple datasets to support equitable model performance across varying skin tones.\u003c/li\u003e\\n\u003cli\u003eTrained convolutional neural networks (CNNs) for image classification tasks.\u003c/li\u003e\\n\u003cli\u003eIntegrated the end-to-end AI pipeline into a mobile application for real-world deployment.\u003c/li\u003e\\n\u003cli\u003eAuthored and published a peer-reviewed paper detailing research findings and technical innovations (see \u003ca href=\\\"#\\\" data-entry-id=\\\"mitigating-racial-biases-mobihoc23\\\"\u003eMitigating Racial Biases for Machine Learning Based Skin Cancer Detection\u003c/a\u003e).\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"skincheck-inclusive-ai-demo\",\"title\":\"SkinCheck Inclusive AI: Mobile Application Demonstration\",\"organization\":\"SkinCheck Inc., Department of AI Research and Development\",\"startDate\":\"2024-05\",\"endDate\":\"2024-10\",\"location\":\"Remote\",\"tags\":[\"computer-vision\",\"ios\",\"android\",\"cloud\",\"machine-learning\",\"dermatology\"],\"summary\":\"Built and deployed a patent-pending on-device ML pipeline for skin cancer detection across iOS, Android, and the cloud.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"research\",\"institution\":\"SkinCheck Inc.\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eImplemented a novel, patent-pending machine learning pipeline optimized for native execution on iOS and Android GPUs.\u003c/li\u003e\\n\u003cli\u003eDeployed the same ML pipeline on Google Cloud\u0026#39;s Vertex AI platform for scalable cloud inference.\u003c/li\u003e\\n\u003cli\u003eEngineered cross-platform compatibility for real-time AI diagnostics across mobile and cloud environments.\u003c/li\u003e\\n\u003cli\u003ePresented the system demonstration at the Association for Health and Learning Inference (AHLI) ML4H Conference, December 2024, Vancouver, Canada.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"tu-bci-research\",\"title\":\"Brain-Computer Interface Machine Learning Inference Research\",\"organization\":\"The University of Tulsa, Tandy School of Computer Science\",\"startDate\":\"2020-09\",\"endDate\":\"2022-05\",\"location\":\"Tulsa, OK\",\"tags\":[\"machine-learning\",\"tensorflow\",\"pytorch\",\"neuroscience\",\"cnn\"],\"summary\":\"Developed ML models (CNNs, Random Forests, KNN) to predict hand movement from motor cortex signals as part of a university BCI research group, continuing through 2022.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"research\",\"institution\":\"The University of Tulsa\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eWorked as a Machine Learning Engineer and Researcher in a university Brain-Computer Interface (BCI) research group.\u003c/li\u003e\\n\u003cli\u003eDeveloped ML models using TensorFlow and PyTorch to predict hand movements from motor cortex signals.\u003c/li\u003e\\n\u003cli\u003eImplemented and evaluated Convolutional Neural Networks (CNNs), Random Forests, and K-Nearest Neighbors (KNN) algorithms.\u003c/li\u003e\\n\u003cli\u003eDesigned and tested an ensemble learning approach to improve prediction accuracy across models.\u003c/li\u003e\\n\u003cli\u003eContributed to a co-authored paper on model-selection voting for EEG data assessment (see \u003ca href=\\\"#\\\" data-entry-id=\\\"ml-democracy-icmla22\\\"\u003eML Democracy: An Enhanced Voting Algorithm for Model Selection for Efficient EEG Data Assessment\u003c/a\u003e).\u003c/li\u003e\\n\u003c/ul\u003e\\n\"},{\"id\":\"tu-skin-cancer-detection-research\",\"title\":\"Skin Cancer Detection: Machine Learning Mobile Application\",\"organization\":\"The University of Tulsa, Tandy School of Computer Science\",\"startDate\":\"2021-05\",\"endDate\":\"2022-04\",\"location\":\"Tulsa, OK\",\"tags\":[\"computer-vision\",\"ios\",\"machine-learning\",\"dermatology\"],\"summary\":\"Developed an iOS application and ML model to detect and track potentially cancerous moles from patient-provided images.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"research\",\"institution\":\"The University of Tulsa\",\"html\":\"\u003cul\u003e\\n\u003cli\u003eConducted research in computer vision with a focus on medical image analysis for skin cancer detection.\u003c/li\u003e\\n\u003cli\u003eDeveloped a machine learning model to identify potentially cancerous moles from patient-provided images.\u003c/li\u003e\\n\u003cli\u003eBuilt and deployed an iOS application enabling users to scan and assess moles for signs of skin cancer.\u003c/li\u003e\\n\u003cli\u003eIntegrated AI diagnostics into a user-friendly mobile interface to support early intervention and self-screening.\u003c/li\u003e\\n\u003c/ul\u003e\\n\"}],\"projects\":[{\"id\":\"a-short-adventure-java-game\",\"title\":\"A Short Adventure\",\"organization\":null,\"startDate\":\"2020-12\",\"endDate\":\"2021-02\",\"tags\":[\"java\",\"game-engine\"],\"summary\":\"A story-driven game with NPCs and adaptive music, built on my game engine as a Valentine's Day gift.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"java\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eAfter my first semester of college, I found myself wanting to make a story-driven game with a fun mechanic. I made this game for my girlfriend over winter break to give to her for Valentine\u0026#39;s Day. I expanded upon my game engine to add in more story driven elements, such as NPCs that the player can talk to and adaptive music.\u003c/p\u003e\\n\"},{\"id\":\"airlectric-drifter-multiplayer-java-game\",\"title\":\"Airlectric Drifter: Multiplayer Java Game\",\"organization\":null,\"startDate\":\"2018-03\",\"endDate\":\"2018-03\",\"tags\":[\"java\",\"game-engine\",\"networking\"],\"summary\":\"Added networking and multiplayer functionality to the engine for a hoverboard combat game played with friends.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"java\",\"networking\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eExpanded upon my \u003ca href=\\\"#\\\" data-entry-id=\\\"game-engine\\\"\u003eGame Engine\u003c/a\u003e to add in networking and multiplayer functionality, creating a multiplayer game where hoverboards shoot at each other.\u003c/p\u003e\\n\"},{\"id\":\"arduino-laser\",\"title\":\"Arduino Laser\",\"organization\":null,\"startDate\":\"2018-06\",\"endDate\":\"2018-07\",\"tags\":[\"java\",\"csharp\",\"arduino\",\"raspberry-pi\",\"hardware\"],\"summary\":\"A wirelessly controlled cat toy: an Arduino-driven laser steered by my mouse position through a Raspberry Pi server.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"java\",\"csharp\",\"arduino\",\"raspberry-pi\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eIn the summer between my Freshman and Sophomore years of high-school, I was faced with the problem of waking up to a playful cat, but not having the motivation to get out of bed. So I did what any normal person would do, I took out my Arduino and raspberry pi, and got to work creating a wirelessly controlled toy to play with my cat. I simply programmed the Arduino to move the given x and y motors by a specified amount when fed data from its USB input.\u003c/p\u003e\\n\u003cp\u003eThe trick that really made it magical though, was the fact that the Arduino wasn\u0026#39;t receiving info directly from my computer, but rather from the Raspberry Pi which was running a different program that turned it into a server receiving info wirelessly from a program I made running on my computer that transmitted my mouse\u0026#39;s x and y location.\u003c/p\u003e\\n\"},{\"id\":\"basic-craft-multiplayer-java-game\",\"title\":\"Basic Craft: Multiplayer Java Game\",\"organization\":null,\"startDate\":\"2018-01\",\"endDate\":\"2018-04\",\"tags\":[\"java\",\"game-engine\",\"networking\"],\"summary\":\"Sandbox multiplayer game built on the custom engine, letting players join a world to build structures and explore.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"java\",\"networking\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eUsed my \u003ca href=\\\"#\\\" data-entry-id=\\\"game-engine\\\"\u003eGame Engine\u003c/a\u003e with custom networking and multiplayer functionality (see \u003ca href=\\\"#\\\" data-entry-id=\\\"airlectric-drifter-multiplayer-java-game\\\"\u003eAirlectric Drifter: Multiplayer Java Game\u003c/a\u003e) to create a game where people join a world and create structures and explore.\u003c/p\u003e\\n\"},{\"id\":\"cosmic-atom-artistic-javascript\",\"title\":\"Cosmic Atom: Artistic JavaScript Program\",\"organization\":null,\"startDate\":\"2020-01\",\"endDate\":\"2020-12\",\"tags\":[\"javascript\",\"generative-art\"],\"summary\":\"Generative-art JavaScript program.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"javascript\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eDeveloped a JavaScript program to create a beautiful and surreal generative artistic piece. Awarded first place in the \u003ca href=\\\"#\\\" data-entry-id=\\\"computer-simulations-graphics-competition\\\"\u003eComputer Simulations and Graphics Competition\u003c/a\u003e.\u003c/p\u003e\\n\"},{\"id\":\"cosmic-inquiry-into-emergence\",\"title\":\"A Cosmic Inquiry into Emergence\",\"organization\":null,\"startDate\":\"2019-09\",\"endDate\":\"2020-03\",\"tags\":[\"generative-art\"],\"summary\":\"Surreal, abstract programmed art meant to prompt viewers' self-discovery, and to argue that programming can be an art form.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eArt always serves as a reflection of the artist, but also as a reflection of the viewers, allowing them to embark on a journey of self-discovery through the worlds of the artist. To me, abstract art is the best way you can understand yourself because, as you search for the artist\u0026#39;s meaning, you\u0026#39;re left with your own meaning, which in turn becomes you. In my artworks, I try to recreate this sense of self-discovery through surreal and abstract visuals that try to fascinate the viewer as they search for themselves. I kept trying to prove that programming was so much more than just lines of code, and should definitely be considered a form of art. Through this frustration, I tried to make my art as abstract and strange as I could, in order to captivate the viewer.\u003c/p\u003e\\n\"},{\"id\":\"digital-picture-frame\",\"title\":\"Digital Picture Frame\",\"organization\":null,\"startDate\":\"2021-06\",\"endDate\":\"2021-08\",\"tags\":[\"java\",\"linux\",\"hardware\"],\"summary\":\"A carved box holding a Linux computer I built, running a program that displays a photo as continuously moving dots.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"java\",\"linux\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eI carved a box to hold a Linux computer I built that runs a program I wrote to display a photo in a dynamic and artistic way, such that it is continuously moving and shows beauty. The photo is of me and my girlfriend portrayed as little dots that flee from wind and gravitate back towards each other, symbolizing our strength and care for each other through our relationship.\u003c/p\u003e\\n\"},{\"id\":\"electroblast-java-game\",\"title\":\"Electroblast\",\"organization\":null,\"startDate\":\"2019-01\",\"endDate\":\"2019-03\",\"tags\":[\"java\",\"game-engine\"],\"summary\":\"A prototype game thrown together over spring break on top of my game engine's new physics engine.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"java\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eDuring my junior year, I began adding a physics engine to my game engine, and I was having a lot of fun with it. Once spring break came around though, I had an idea for a fun way to play a game, and quickly threw together a fun little game. The game was really a prototype, as I wanted to experiment and make it much more interesting.\u003c/p\u003e\\n\"},{\"id\":\"emergent-algorithmic-artworks-honors-project\",\"title\":\"Emergent Algorithmic Artworks – Honors Project\",\"organization\":\"The University of Tulsa\",\"startDate\":\"2023-01\",\"endDate\":\"2024-04\",\"tags\":[\"generative-art\"],\"summary\":\"Artworks generated by programs I built to capture emergence, now on permanent display at The University of Tulsa's Tandy School of Computer Science.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eMy four year honors program at The University of Tulsa culminated in the creation of beautiful artworks generated through computer programs I built to encapsulate the cosmic idea of emergence, how beautifully complex systems come into view through slight interaction changes within the smallest atoms that make up the system.\u003c/p\u003e\\n\u003cp\u003eAmazingly, these artworks are put on permanent display at The University of Tulsa\u0026#39;s Tandy School of Computer Science in Rayzor Hall.\u003c/p\u003e\\n\u003cp\u003eTake a look at the artworks and a brief description of the systems I built to emerge them here.\u003c/p\u003e\\n\"},{\"id\":\"evolving-flocking-agents-javascript-simulation\",\"title\":\"Evolving Flocking Agents: JavaScript Simulation\",\"organization\":null,\"startDate\":\"2021-01\",\"endDate\":\"2021-12\",\"tags\":[\"javascript\",\"genetic-algorithms\"],\"summary\":\"Simulated flocking behaviors and used a genetic algorithm to solve a steering problem.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"javascript\",\"genetic-algorithms\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eSimulated flocking behaviors and implemented a genetic algorithm to solve a steering problem.\u003c/p\u003e\\n\"},{\"id\":\"evolving-neural-networks\",\"title\":\"Evolving Neural Networks\",\"organization\":null,\"startDate\":\"2018-05\",\"endDate\":\"2018-08\",\"tags\":[\"java\",\"neural-networks\",\"genetic-algorithms\",\"game-engine\"],\"summary\":\"A population of AIs evolved with Neural Evolution of Augmented Topologies to beat a Flappy Bird clone built on my custom Java game engine.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"java\",\"neural-networks\",\"genetic-algorithms\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eDuring the summer between my Sophomore and Junior year of high-school I began work on an AI Algorithm I\u0026#39;d always been wanting to make: Neural Evolution of Augmented Topologies. I remember back in eighth grade when I first saw a YouTube video of someone training an AI to play Super Mario. I thought it was the coolest thing ever, and I was convinced this was the algorithm that could create self-aware AI. Finally, once I knew enough about AI to make neural networks from scratch in Java, I used my custom game engine to build a virtual environment that mimicked the game \u0026quot;Flappy Bird\u0026quot;. Using this environment, I would evolve a population of AI to beat Flappy Bird. After a month or so, I had finally done it.\u003c/p\u003e\\n\"},{\"id\":\"game-engine\",\"title\":\"Game Engine\",\"organization\":null,\"startDate\":\"2016-05\",\"endDate\":\"2017-11\",\"tags\":[\"java\",\"game-engine\"],\"summary\":\"A Java game engine built from scratch to reduce the development time of future games.\",\"featured\":false,\"links\":[{\"label\":\"GitHub repository\",\"url\":\"https://github.com/julian-abhari/GameEngine\"}],\"media\":[],\"category\":\"projects\",\"techStack\":[\"java\"],\"repoUrl\":\"https://github.com/julian-abhari/GameEngine\",\"demoUrl\":null,\"html\":\"\u003cp\u003eThis is a Game Engine I built from scratch to reduce the development time of any future games I want to build.\u003c/p\u003e\\n\"},{\"id\":\"growth-artistic-javascript\",\"title\":\"Growth: Artistic JavaScript Program\",\"organization\":null,\"startDate\":\"2020-01\",\"endDate\":\"2020-12\",\"tags\":[\"javascript\",\"generative-art\",\"p5js\"],\"summary\":\"Generative-art JavaScript program exploring organic growth patterns.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"javascript\",\"p5js\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eDeveloped a JavaScript program to create a beautiful and surreal generative artistic piece. Awarded first place in the \u003ca href=\\\"#\\\" data-entry-id=\\\"computer-simulations-graphics-competition\\\"\u003eComputer Simulations and Graphics Competition\u003c/a\u003e.\u003c/p\u003e\\n\"},{\"id\":\"play4change-html5-p5js-website\",\"title\":\"Play4Change\",\"organization\":null,\"startDate\":\"2019-05\",\"endDate\":\"2019-09\",\"tags\":[\"javascript\",\"p5js\",\"html5\"],\"summary\":\"A website where users upload games that others play, with ad revenue donated to charities focused on preventing climate change.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"html5\",\"p5js\",\"javascript\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eThis website, play4change, is dedicated to preventing climate change through donations to various tree-planting charities. The website is still being developed; however, the core functionality is finished and the actual website is nearing completion. With play4change, users can upload any game or program they make, while other users play these games and earn ad revenue that gets donated to charities focussed on preventing climate change. I\u0026#39;ve been making this website since the start of my Senior year of high-school, and it was difficult to get started, as I had to work in an unfamiliar language. Sharing games and protecting the environment is something that is very dear to me, so I\u0026#39;m especially excited to launch this website whenever it gets completed.\u003c/p\u003e\\n\"},{\"id\":\"raptor-run-ios-game\",\"title\":\"Raptor-Run: iOS Game\",\"organization\":null,\"startDate\":\"2016-01\",\"endDate\":\"2016-12\",\"tags\":[\"ios\"],\"summary\":\"Early iOS game built to learn app programming.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"ios\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eDeveloped this game to learn how to program and write apps.\u003c/p\u003e\\n\"},{\"id\":\"sfoungari-artistic-javascript\",\"title\":\"Sfoungari: Artistic JavaScript Program\",\"organization\":null,\"startDate\":\"2020-01\",\"endDate\":\"2020-12\",\"tags\":[\"javascript\",\"generative-art\",\"3d\"],\"summary\":\"3-dimensional generative-art JavaScript program.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"javascript\",\"3d\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eDeveloped a 3-dimensional JavaScript program to create a beautiful and surreal generative artistic piece. Awarded first place in the \u003ca href=\\\"#\\\" data-entry-id=\\\"computer-simulations-graphics-competition\\\"\u003eComputer Simulations and Graphics Competition\u003c/a\u003e.\u003c/p\u003e\\n\"},{\"id\":\"skin-check-v1\",\"title\":\"Skin Check v1\",\"organization\":\"SkinCheck\",\"startDate\":\"2018-06\",\"endDate\":\"2021-12\",\"tags\":[\"ios\",\"machine-learning\",\"computer-vision\",\"dermatology\"],\"summary\":\"A free tool for checking moles, tracking them over time, and comparing them to an index of mole types.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"ios\",\"machine-learning\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eBefore my app became my startup company, it was my high-school passion project that I was developing to help my mom with her own skin cancer struggles.\u003c/p\u003e\\n\u003cp\u003eSkin Check is a free assistive tool to allow anyone to check their moles for skin cancer, track their moles over time, and compare their moles to an index of different cancerous and non-cancerous mole types.\u003c/p\u003e\\n\u003cp\u003eAccording to the Skin Cancer Foundation, two people die every hour from skin-cancer in the U.S. alone. The hope for my app is to bring down this alarming statistic by letting users know if their moles are concerning and recommending them to seek treatment.\u003c/p\u003e\\n\u003cp\u003eI have spent four years working on this app, the first version was released just before my senior year of high school in 2019, and then I picked it back up in 2021 during the end of my Freshman year in college where I worked on it thanks to the Tulsa Undergraduate Research Challenge (TURC) and released it during my Sophomore year of college.\u003c/p\u003e\\n\"},{\"id\":\"smart-rockets-ios-ml-app\",\"title\":\"Smart-Rockets: iOS Machine Learning App\",\"organization\":null,\"startDate\":\"2018-01\",\"endDate\":\"2018-12\",\"tags\":[\"ios\",\"genetic-algorithms\",\"machine-learning\"],\"summary\":\"iOS app letting users interact with real-time machine learning by designing levels for a genetic algorithm to solve.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[\"ios\",\"genetic-algorithms\",\"machine-learning\"],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eDeveloped an app that lets users interact with real-time machine learning by creating levels for a genetic algorithm to solve.\u003c/p\u003e\\n\"},{\"id\":\"tesla-coil\",\"title\":\"Tesla Coil\",\"organization\":null,\"startDate\":\"2018-06\",\"endDate\":\"2018-12\",\"tags\":[\"hardware\"],\"summary\":\"A Tesla Coil built from scratch with my high-school Physics teacher.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"projects\",\"techStack\":[],\"repoUrl\":null,\"demoUrl\":null,\"html\":\"\u003cp\u003eAfter spending many years dreaming about a world where Tesla\u0026#39;s wireless transmission of energy technology could be used to send solar panels into space and have them beam energy down to Earth, creating a green and easily accessible source of energy, I spent the end of my Sophomore year and the beginning of my Junior year of high-school finally creating a Tesla Coil with my Physics teacher.\u003c/p\u003e\\n\u003cp\u003eThis was quite an enormous task, as it forced me to learn the basics of electricity, modifying a high-voltage transformer, building high-voltage capacitors, winding the primary and secondary coils, learning about spark gaps, and finally, wiring everything together and tuning it.\u003c/p\u003e\\n\"}],\"education\":[{\"id\":\"university-of-tulsa-bs-cs-cybersecurity\",\"title\":\"B.S. in Computer Science and Cyber Security\",\"organization\":\"The University of Tulsa\",\"startDate\":\"2020-08\",\"endDate\":\"2024-05\",\"location\":\"Tulsa, OK\",\"tags\":[\"computer-science\",\"cybersecurity\",\"mathematics\"],\"summary\":\"B.S. in Computer Science and Cyber Security with a Minor in Mathematics; Honors \u0026 Presidential Scholar.\",\"featured\":false,\"links\":[],\"media\":[],\"category\":\"education\",\"institution\":\"The University of Tulsa\",\"degree\":\"Bachelor of Science\",\"field\":\"Computer Science and Cyber Security (Minor: Mathematics)\",\"gpa\":3.82,\"html\":\"\u003cp\u003eBachelor of Science in Computer Science and Cyber Security, Minor in Mathematics. Honors \u0026amp; Presidential Scholar.\u003c/p\u003e\\n\u003cp\u003eRelated coursework: Statistical Learning and Neural Networks, Operating Systems, Computer Networks, Digital Systems and Design.\u003c/p\u003e\\n\"}],\"publications\":[{\"id\":\"mitigating-racial-biases-mobihoc23\",\"title\":\"Mitigating Racial Biases for Machine Learning Based Skin Cancer Detection\",\"organization\":\"ACM MobiHoc '23\",\"startDate\":\"2023-10\",\"endDate\":\"2023-10\",\"location\":\"Washington, DC, USA\",\"tags\":[\"computer-vision\",\"cyclegan\",\"bias-mitigation\",\"dermatology\"],\"summary\":\"Peer-reviewed paper on domain adaptation techniques to reduce racial bias in ML-based skin cancer detection models.\",\"featured\":false,\"links\":[{\"label\":\"DOI\",\"url\":\"https://doi.org/10.1145/3565287.3617639\"}],\"media\":[],\"category\":\"publications\",\"authors\":[\"Julian Abhari\",\"Ashwin Ashok\"],\"venue\":\"MobiHoc '23, October 23-26, 2023, Washington, DC, USA. ACM, New York, NY, USA, 6 pages.\",\"doi\":\"10.1145/3565287.3617639\",\"publicationDate\":\"2023-10\",\"html\":\"\u003cp\u003ePresents research conducted as part of the NSF REU program at Georgia State University (see \u003ca href=\\\"#\\\" data-entry-id=\\\"nsf-reu-racial-bias-skin-cancer\\\"\u003eMitigating Racial Biases for Skin Cancer Detection (NSF REU)\u003c/a\u003e): domain adaptation and CycleGAN-based dataset debiasing to improve the fairness and generalization of machine learning models for skin cancer detection across skin tones.\u003c/p\u003e\\n\"},{\"id\":\"ml-democracy-icmla22\",\"title\":\"ML Democracy: An Enhanced Voting Algorithm for Model Selection for Efficient EEG Data Assessment\",\"organization\":\"IEEE ICMLA 2022\",\"startDate\":\"2022-12\",\"endDate\":\"2022-12\",\"location\":\"Nassau, Bahamas\",\"tags\":[\"machine-learning\",\"eeg\",\"model-selection\"],\"summary\":\"Minor-contributor paper introducing an enhanced voting algorithm for efficient model selection in EEG data assessment.\",\"featured\":false,\"links\":[{\"label\":\"DOI\",\"url\":\"https://doi.org/10.1109/ICMLA55696.2022.10232919\"}],\"me
